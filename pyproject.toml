[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperdbg-mcp"
version = "0.0.1"
description = "MCP server exposing the HyperDbg debugger to LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "munraimix" }]
keywords = ["hyperdbg", "mcp", "debugger", "reverse-engineering", "model-context-protocol"]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
hyperdbg-mcp = "hyperdbg_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperdbg_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
